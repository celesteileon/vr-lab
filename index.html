
<!DOCTYPE html>
<html>
<head>
  <title>Sephora Virtual Fragrance Experience</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <script>
    AFRAME.registerComponent('try-perfume', {
      init: function () {
        this.el.addEventListener('click', () => {
          const message = document.querySelector('#scent-message');
          const bottle = document.querySelector('#perfume-bottle');
          const particles = document.querySelector('#scent-particles');

          message.setAttribute('value',
            'YSL LIBRE\\nYour virtual fragrance experience is activated!\\n\\nImagine notes of lavender, orange blossom\\nand warm vanilla.\\n\\nDiscover your signature scent.'
          );

          particles.setAttribute('visible', true);

          bottle.setAttribute('animation', {
            property: 'position',
            to: '0 2.5 -5',
            dur: 1000,
            dir: 'alternate',
            loop: 2
          });
        });
      }
    });
  </script>
</head>

<body>
<a-scene background="color: #f5f0ec">

  <!-- LIGHTING -->
  <a-entity light="type: ambient; intensity: 1.2"></a-entity>
  <a-entity light="type: point; intensity: 1.5"
            position="0 5 -4"></a-entity>

  <!-- STORE FLOOR -->
  <a-plane position="0 0 -5"
           rotation="-90 0 0"
           width="14" height="20"
           color="#eeeeee"></a-plane>

  <!-- WALLS -->
  <a-box position="0 3 -11"
         width="14" height="6" depth="0.2"
         color="#ffffff"></a-box>

  <a-box position="-7 3 -5"
         width="0.2" height="6" depth="12"
         color="#ffffff"></a-box>

  <a-box position="7 3 -5"
         width="0.2" height="6" depth="12"
         color="#ffffff"></a-box>

  <!-- SEPHORA SIGN -->
  <a-text value="SEPHORA"
          position="-1.5 4.8 -10.85"
          color="#000000"
          width="8"
          align="center"
          scale="2 2 2"></a-text>

  <a-text value="BEAUTY BEGINS HERE"
          position="-1.5 4.2 -10.8"
          color="#333333"
          width="5"
          align="center"></a-text>

  <!-- LEFT BEAUTY SHELVES -->
  <a-box position="-5 1.5 -4"
         width="2.5" height="3"
         depth="0.5" color="#222222"></a-box>

  <a-box position="-5 0.8 -3.7"
         width="2.6" height="0.1"
         depth="0.8" color="#ffffff"></a-box>

  <a-box position="-5 1.8 -3.7"
         width="2.6" height="0.1"
         depth="0.8" color="#ffffff"></a-box>

  <a-box position="-5 2.8 -3.7"
         width="2.6" height="0.1"
         depth="0.8" color="#ffffff"></a-box>

  <!-- RIGHT BEAUTY SHELVES -->
  <a-box position="5 1.5 -4"
         width="2.5" height="3"
         depth="0.5" color="#222222"></a-box>

  <a-box position="5 0.8 -3.7"
         width="2.6" height="0.1"
         depth="0.8" color="#ffffff"></a-box>

  <a-box position="5 1.8 -3.7"
         width="2.6" height="0.1"
         depth="0.8" color="#ffffff"></a-box>

  <a-box position="5 2.8 -3.7"
         width="2.6" height="0.1"
         depth="0.8" color="#ffffff"></a-box>

  <!-- CENTER YSL ADVERTISEMENT -->
  <a-box position="0 2.8 -9"
         width="5" height="4"
         depth="0.15"
         color="#111111"></a-box>

  <a-plane position="0 2.8 -8.9"
           width="4.7" height="3.7"
           color="#d5b18a"></a-plane>

  <a-text value="YVES SAINT LAURENT"
          position="0 4.1 -8.8"
          color="#111111"
          align="center"
          width="6"></a-text>

  <a-text value="LIBRE"
          position="0 3.5 -8.8"
          color="#111111"
          align="center"
          width="7"></a-text>

  <a-text value="THE NEW FRAGRANCE OF FREEDOM"
          position="0 3.1 -8.8"
          color="#222222"
          align="center"
          width="3.5"></a-text>

  <!-- PERFUME BOTTLE DISPLAY -->
  <a-entity id="perfume-bottle"
            position="0 1.8 -8.5">

    <!-- Bottle -->
    <a-box width="0.8" height="1.2" depth="0.3"
           color="#d6b68c"
           material="metalness: 0.5; roughness: 0.2"></a-box>

    <!-- Bottle cap -->
    <a-box position="0 0.7 0"
           width="0.35" height="0.2" depth="0.3"
           color="#111111"></a-box>

    <a-text value="YSL"
            position="0 0 0.17"
            color="#111111"
            align="center"
            width="2"></a-text>
  </a-entity>

  <!-- INTERACTIVE TRY-ON BUTTON -->
  <a-box class="clickable"
         try-perfume
         position="0 0.7 -7"
         width="2.2" height="0.6" depth="0.2"
         color="#111111"></a-box>

  <a-text value="CLICK TO TRY THE SCENT"
          position="0 0.7 -6.88"
          align="center"
          color="#ffffff"
          width="3"></a-text>

  <!-- SCENT PARTICLES -->
  <a-entity id="scent-particles" visible="false">
    <a-sphere position="-0.8 2.5 -7.5"
              radius="0.12" color="#f4d7a1"
              animation="property: position; to: -1 3.5 -7.5; dur: 2000; loop: true; dir: alternate"></a-sphere>

    <a-sphere position="0.8 2.3 -7.5"
              radius="0.15" color="#f4d7a1"
              animation="property: position; to: 1 3.5 -7.5; dur: 2500; loop: true; dir: alternate"></a-sphere>

    <a-sphere position="0 2.7 -7.5"
              radius="0.1" color="#ffffff"
              animation="property: position; to: 0 3.8 -7.5; dur: 1800; loop: true; dir: alternate"></a-sphere>
  </a-entity>

  <!-- EXPERIENCE MESSAGE -->
  <a-text id="scent-message"
          value="DISCOVER YOUR SIGNATURE SCENT"
          position="0 0.2 -5"
          align="center"
          color="#111111"
          width="5"></a-text>

  <!-- CAMERA AND MOVEMENT -->
  <a-entity position="0 1.6 5">
    <a-camera wasd-controls
              look-controls
              cursor="rayOrigin: mouse"
              raycaster="objects: .clickable">
    </a-camera>
  </a-entity>

  <!-- SKY -->
  <a-sky color="#e8e4e0"></a-sky>

</a-scene>
</body>
</html>
